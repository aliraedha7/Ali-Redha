# تكوين خادم Nginx لاستضافة التطبيق (React SPA)
server {
    listen 80;
    server_name your-domain.com; # ضع دومين موقعك هنا

    root /var/www/html; # مسار رفع محتويات المجلد على السيرفر
    index index.html;

    # توجيه جميع المسارات إلى index.html لضمان عمل الـ React SPA بدون أخطاء 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # التخزين المؤقت للملفات الثابتة لزيادة سرعة التحميل
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ضغط Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
}
